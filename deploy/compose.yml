name: wonkvod

services:
  wonkvod-backend:
    image: "wonkvod-backend:${WONKVOD_VERSION:?set WONKVOD_VERSION via deploy/deploy.sh}"
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VCS_REF: "${WONKVOD_GIT_COMMIT:?set WONKVOD_GIT_COMMIT via deploy/deploy.sh}"
        APP_VERSION: "${WONKVOD_APP_VERSION:-1.0.1}"
    container_name: wonkvod-backend
    restart: unless-stopped
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    env_file:
      - "${WONKVOD_PROVIDER_ENV_FILE:-/opt/wonkvod-runtime/xtream.env}"
    environment:
      WONKVOD_PMS_MODE: "${WONKVOD_PMS_MODE:-real-catalog}"
      WONKVOD_PROVIDER_VARIANT: "${WONKVOD_PROVIDER_VARIANT:-real}"
      WONKVOD_PROVIDER_FEATURE_VARIANT: "${WONKVOD_PROVIDER_FEATURE_VARIANT:-real}"
      WONKVOD_PMS_UPSTREAM: "http://plex-identity:32400"
      WONKVOD_CATALOG_STATE: "/var/lib/wonkvod/catalog.json"
      WONKVOD_CONFIG_STATE: "/var/lib/wonkvod/config.json"
      WONKVOD_AUTH_STATE: "/var/lib/wonkvod/auth.json"
      WONKVOD_WEB_ADDR: ":32501"
      WONKVOD_PROFILE_REQUESTS: "${WONKVOD_PROFILE_REQUESTS:-0}"
      WONKVOD_PROVIDER_PROXY_URL: "${WONKVOD_PROVIDER_PROXY_URL:-}"
      WONKVOD_MACHINE_IDENTIFIER: "${WONKVOD_MACHINE_IDENTIFIER:?set WONKVOD_MACHINE_IDENTIFIER in deploy/.env}"
      WONKVOD_SECURE_URI: "${WONKVOD_SECURE_URI:?set WONKVOD_SECURE_URI in deploy/.env}"
    volumes:
      - type: bind
        source: "${PLEX_IDENTITY_CONTROL_MEDIA:-/opt/plex-identity/test2.mp4}"
        target: /opt/plex-identity/test2.mp4
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${WONKVOD_STATE_DIR:-/opt/wonkvod-runtime/state}"
        target: /var/lib/wonkvod
        read_only: false
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:32501/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    ports:
      - "${WONKVOD_WEB_BIND_IP:-127.0.0.1}:${WONKVOD_WEB_PORT:-32501}:32501/tcp"
    networks:
      - facade
      - plex-identity
      - provider-egress
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  wonkvod-tls:
    image: "wonkvod-tls:${WONKVOD_TLS_VERSION:-17fc3f4}"
    build:
      context: ..
      dockerfile: deploy/tls/Dockerfile
    container_name: wonkvod-tls
    restart: unless-stopped
    read_only: true
    init: true
    user: "${PLEX_IDENTITY_UID:-1000}:${PLEX_IDENTITY_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      LISTEN_ADDR: ":32499"
      BACKEND_URL: "http://wonkvod-backend:32499"
      PLEX_P12_PATH: "/plex/cache/cert-v2.p12"
      PLEX_PREFERENCES_PATH: "/plex/Preferences.xml"
      PLEX_TLS_HOSTNAME: "${PLEX_TLS_HOSTNAME:?set PLEX_TLS_HOSTNAME in deploy/.env}"
      CERT_POLL_INTERVAL: "60s"
    volumes:
      - type: bind
        source: "${PLEX_IDENTITY_CONFIG_DIR:-/opt/plex-identity/config/Library/Application Support/Plex Media Server}/Cache"
        target: /plex/cache
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${PLEX_IDENTITY_CONFIG_DIR:-/opt/plex-identity/config/Library/Application Support/Plex Media Server}/Preferences.xml"
        target: /plex/Preferences.xml
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${WONKVOD_PLEX_PORT:-32499}:32499/tcp"
    depends_on:
      wonkvod-backend:
        condition: service_healthy
    networks:
      - facade
      - edge
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  facade:
    internal: true
  edge:
  plex-identity:
    external: true
    name: "${PLEX_IDENTITY_NETWORK:-plex-identity_default}"
  provider-egress:
    external: true
    name: "${WONKVOD_PROVIDER_PROXY_NETWORK:-gluetun_default}"
