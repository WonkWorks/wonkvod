name: wonkvod

services:
  wonkvod-backend:
    image: "wonkvod-backend:${WONKVOD_VERSION:?set WONKVOD_VERSION via deploy/deploy.sh}"
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VCS_REF: "${WONKVOD_GIT_COMMIT:?set WONKVOD_GIT_COMMIT via deploy/deploy.sh}"
    container_name: wonkvod-backend
    restart: unless-stopped
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    env_file:
      - /opt/wonkvod-runtime/xtream.env
    environment:
      WONKVOD_PMS_MODE: "${WONKVOD_PMS_MODE:-real-catalog}"
      WONKVOD_PROVIDER_VARIANT: "${WONKVOD_PROVIDER_VARIANT:-real}"
      WONKVOD_PROVIDER_FEATURE_VARIANT: "${WONKVOD_PROVIDER_FEATURE_VARIANT:-real}"
      WONKVOD_PMS_UPSTREAM: "http://plex-identity:32400"
      WONKVOD_CATALOG_STATE: "/var/lib/wonkvod/catalog.json"
    volumes:
      - type: bind
        source: /opt/plex-identity/test2.mp4
        target: /opt/plex-identity/test2.mp4
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/wonkvod-runtime/state
        target: /var/lib/wonkvod
        read_only: false
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:32499/identity"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - facade
      - plex-identity
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  wonkvod-tls:
    image: "wonkvod-tls:${WONKVOD_TLS_VERSION:-17fc3f4}"
    build:
      context: ..
      dockerfile: deploy/tls/Dockerfile
    container_name: wonkvod-tls
    restart: unless-stopped
    read_only: true
    init: true
    user: "${PLEX_IDENTITY_UID:-1000}:${PLEX_IDENTITY_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      LISTEN_ADDR: ":32499"
      BACKEND_URL: "http://wonkvod-backend:32499"
      PLEX_P12_PATH: "/plex/cache/cert-v2.p12"
      PLEX_PREFERENCES_PATH: "/plex/Preferences.xml"
      PLEX_TLS_HOSTNAME: "192-0-2-22.fixture.example.invalid"
      CERT_POLL_INTERVAL: "60s"
    volumes:
      - type: bind
        source: /opt/plex-identity/config/Library/Application Support/Plex Media Server/Cache
        target: /plex/cache
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/plex-identity/config/Library/Application Support/Plex Media Server/Preferences.xml
        target: /plex/Preferences.xml
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "32499:32499/tcp"
    depends_on:
      wonkvod-backend:
        condition: service_healthy
    networks:
      - facade
      - edge
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  facade:
    internal: true
  edge:
  plex-identity:
    external: true
    name: plex-identity_default
